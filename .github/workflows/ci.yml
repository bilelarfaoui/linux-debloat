name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -x debloat.sh lib/*.sh distros/*.sh tests/*.sh

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke tests
        run: bash tests/smoke.sh
      - name: Apply path with stubbed apt
        run: sudo bash tests/test_apply_stub.sh

  # Dry runs on each real family. Nothing is removed, this only proves that
  # detection, package queries and list parsing work with the native tools.
  dry-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:stable", "ubuntu:latest", "fedora:latest", "archlinux:latest"]
    container: ${{ matrix.image }}
    steps:
      - name: Install prerequisites
        run: |
          if command -v apt-get >/dev/null; then apt-get update && apt-get install -y git;
          elif command -v dnf >/dev/null; then dnf install -y git gawk findutils;
          elif command -v pacman >/dev/null; then pacman -Sy --noconfirm git;
          fi
      - uses: actions/checkout@v4
      - name: List categories
        run: bash debloat.sh --list
      - name: Dry run, every category
        run: bash debloat.sh -c all
